[package]
name = "motor"
description = "Motor do Destila: inspeção e conversão de áudio (ffmpeg, ffprobe e raw2bmx)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
hound = "3.5"

[[bin]]
name = "motor-cli"
path = "src/bin/motor-cli.rs"
